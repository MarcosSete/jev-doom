[project]
name = "jev-doom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "vizdoom>=1.3.0",
    "gymnasium>=0.29.1",
    "pyyaml>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev=[
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

[tool.ruff]
line-length = 88
target-version = "py312"